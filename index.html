<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6FB">
<meta name="description" content="Daily lectures, the weekly timetable and end-semester exam countdowns.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semester">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Semester</title>
<style>
:root{
  --canvas:#F3F6FB; --surface:#FFFFFF; --surface2:#F7F9FD; --line:#DFE7F2; --line2:#EEF2F8; --lineHi:#C9D9EC;
  --ink:#16243D; --ink2:#43546F; --ink3:#7A8BA6; --faint:#A9BBD0;
  --blue:#2F6BFF; --blueDeep:#1B4FD6; --sky:#E8EFFF; --skyLine:#CFDEFF;
  --green:#16A34A; --amber:#F5B400; --amberInk:#A16B00; --red:#E5484D; --yellow:#FFD23F;
  --shadow:0 1px 2px rgba(22,36,61,.05), 0 8px 24px -14px rgba(22,36,61,.2);
  --shadowUp:0 -8px 32px -12px rgba(22,36,61,.25);
  --disp:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --rs:11px;
  --ease:cubic-bezier(.22,.85,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--canvas)}
body{
  font-family:var(--body); color:var(--ink); background:var(--canvas);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none; transition:background-color .3s var(--ease);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea{background:none;border:0;outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

.app{max-width:560px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}

/* ============ header ============ */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.today{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.clockbox{text-align:right;flex-shrink:0}
.clock{font-family:var(--disp);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.roll{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;color:var(--ink3);font-weight:600;margin-top:3px}

/* ============ status card ============ */
.status{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);overflow:hidden}
.status::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--blue))}
.stag{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;padding:4px 9px;border-radius:99px;flex-shrink:0}
.stag.live{background:rgba(222,66,57,.1);color:var(--red)}
.stag.soon{background:var(--sky);color:var(--blueDeep)}
.stag.free{background:rgba(18,154,103,.12);color:var(--green)}
.stag.exam{background:rgba(217,138,11,.12);color:var(--amberInk)}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.shead{margin-top:11px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.scode{font-family:var(--disp);font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1;color:var(--accent,var(--ink))}
.sroom{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:5px 10px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.sname{margin-top:7px;font-size:14px;color:var(--ink2);font-weight:500;line-height:1.35}
.strack{margin-top:13px;height:5px;border-radius:99px;background:var(--line2);overflow:hidden}
.sfill{height:100%;border-radius:99px;background:var(--accent,var(--blue));width:0;transition:width .8s var(--ease)}
.smeta{margin-top:8px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums;font-weight:500}
.smeta strong{color:var(--ink);font-weight:700}
.snext{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:9px;
  width:100%;text-align:left}
.snext + .snext{margin-top:11px;padding-top:11px}
.snext .nc{font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap}
.snext .nr{font-size:12.5px;color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snext .nw{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--blueDeep);white-space:nowrap;
  font-variant-numeric:tabular-nums}
button.snext .nw::after{content:" \203A";font-weight:700}

/* ============ tabs ============ */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:4px;margin:18px 0 16px;box-shadow:var(--shadow);position:relative}
.tab{flex:1;padding:9px 0;border-radius:9px;font-family:var(--disp);font-size:13px;font-weight:600;
  color:var(--ink3);text-align:center;transition:color .25s var(--ease);position:relative;z-index:1}
.tab[aria-selected="true"]{color:#fff}
.glide{position:absolute;top:4px;bottom:4px;left:0;border-radius:9px;background:var(--blue);z-index:0;
  box-shadow:0 6px 14px -8px var(--blue)}
.glide.ready{transition:transform .38s var(--ease), width .38s var(--ease)}

/* ============ view ============ */
.view{animation:rise .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.section{font-family:var(--disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;margin:20px 3px 9px;display:flex;align-items:center;gap:9px}
.section:first-child{margin-top:2px}
.section::after{content:"";flex:1;height:1px;background:var(--line)}
.section .sx{order:2;letter-spacing:.08em;text-transform:none;font-size:11px}

/* ============ day picker ============ */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:4px}
.dchip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 0 7px;
  text-align:center;box-shadow:var(--shadow);transition:background .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.dchip:active{transform:scale(.95)}
.dchip .dn{display:block;font-family:var(--disp);font-size:13px;font-weight:700}
.dchip .dc{display:block;font-size:10px;color:var(--ink3);font-weight:600;margin-top:2px}
.dchip.is-today .dn::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--red);margin-left:4px;vertical-align:middle;position:relative;top:-1px}
.dchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.dchip[aria-pressed="true"] .dc{color:inherit;opacity:.7}

/* ============ class row ============ */
.rail{display:flex;flex-direction:column;gap:8px}
.cls{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
  animation:rise .4s var(--ease) both}
.cls::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.cls:active{transform:scale(.982)}
.cls:hover{border-color:var(--lineHi)}
.cls.past{opacity:.5}
.cls.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 30px -18px var(--accent)}
.ctime{font-family:var(--disp);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;
  line-height:1.4;font-weight:600}
.ctime b{display:block;color:var(--ink);font-size:14.5px;font-weight:700}
.ccode{font-family:var(--disp);font-size:15.5px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.cname{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.3;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cwho{font-size:11.5px;color:var(--ink3);margin-top:2px;font-weight:400}
.cright{text-align:right;flex-shrink:0}
.croom{font-family:var(--disp);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink2);display:inline-block;white-space:nowrap}
.clivebadge{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.16em;font-weight:700;
  color:var(--red);margin-top:5px}

.nowline{display:flex;align-items:center;gap:9px;padding:2px 3px;animation:rise .4s var(--ease) both}
.nowline .lbl{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--red);
  background:rgba(222,66,57,.1);padding:3px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.nowline .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--red),transparent)}

.gap{display:flex;align-items:center;gap:9px;padding:0 8px;font-family:var(--disp);font-size:10.5px;
  font-weight:600;letter-spacing:.06em;color:var(--ink3);font-variant-numeric:tabular-nums;animation:rise .4s var(--ease) both}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.gap.warn{color:var(--amberInk)}
.gap.warn::before,.gap.warn::after{border-color:rgba(217,138,11,.4)}
.doneline{text-align:center;font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green);font-weight:700;margin-top:8px}

.blank{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
  padding:30px 20px;text-align:center}
.blank .bt{font-family:var(--disp);font-size:16px;font-weight:700;margin-bottom:5px}
.blank .bs{font-size:13px;color:var(--ink3);line-height:1.5}

/* ============ week grid ============ */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:10px 8px 14px 0;animation:rise .4s var(--ease) both}
.wkhead,.wkbody{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr));gap:4px}
.wkhead{margin-bottom:8px}
.wkday{text-align:center;font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);padding:6px 0;border-radius:8px}
.wkday.on{background:var(--blue);color:#fff}
.wkhours,.wkcol{position:relative;height:560px}
.wkhours span{position:absolute;right:7px;transform:translateY(-50%);font-family:var(--disp);font-size:9.5px;
  font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.wkcol{border-radius:8px;
  background-image:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px 10%)}
.wkcol.on{background-color:var(--sky)}
.blk{position:absolute;left:0;right:0;border-radius:7px;padding:4px 5px 4px 6px;text-align:left;overflow:hidden;
  border-left:3px solid var(--accent);background:linear-gradient(var(--tint),var(--tint)) var(--surface);
  transition:transform .15s var(--ease);
  animation:rise .4s var(--ease) both}
.blk:active{transform:scale(.96)}
.blk b{display:block;font-family:var(--disp);font-size:10.5px;font-weight:700;color:var(--accent);line-height:1.25;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk i{display:block;font-style:normal;font-size:9.5px;font-weight:600;color:var(--ink2);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.past{opacity:.45}
.blk.live{box-shadow:0 0 0 1.5px var(--accent)}
.wknow{position:absolute;left:-2px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.wknow::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.wksum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px 11px;
  box-shadow:var(--shadow);animation:rise .4s var(--ease) both}
.statnum{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.statlbl{font-size:10px;color:var(--ink3);margin-top:5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ============ exams ============ */
.hero{position:relative;background:linear-gradient(140deg,#3B78FF 0%,#2F6BFF 45%,#1F55E0 100%);color:#fff;
  border-radius:var(--r);padding:18px 16px 16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(22,36,61,.06),0 16px 32px -18px rgba(47,107,255,.7);animation:rise .4s var(--ease) both}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,var(--yellow) 0,transparent 66%);opacity:.45;pointer-events:none}
.hero > *{position:relative}
.htag{display:inline-block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:#16243D;background:var(--yellow);padding:4px 9px;border-radius:99px}
.hcode{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:-.025em;margin-top:11px;line-height:1}
.hname{font-size:13.5px;color:rgba(255,255,255,.88);margin-top:6px;line-height:1.35;font-weight:500}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cd div{background:#fff;border-radius:12px;padding:11px 0 9px;text-align:center;box-shadow:0 6px 16px -10px rgba(10,30,90,.5)}
.cd b{display:block;font-family:var(--disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--blueDeep)}
.cd div:last-child b{color:var(--red)}
.cd span{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;margin-top:6px}
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hchip{font-family:var(--disp);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;
  background:rgba(255,255,255,.18);color:#fff;font-variant-numeric:tabular-nums}
.track{display:grid;gap:4px;margin-top:16px}
.tc{height:30px;border-radius:7px;background:rgba(255,255,255,.14);display:grid;place-items:center;
  font-family:var(--disp);font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.tc.hit{background:#fff;color:var(--tc);box-shadow:inset 0 -3px 0 var(--tc)}
.tc.past{opacity:.4}
.tc.now{outline:2px solid var(--yellow);outline-offset:1px}
.tlbl{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--disp);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
.hdone{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px}

.ex{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 15px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .4s var(--ease) both;
  transition:border-color .2s var(--ease)}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ex.done{opacity:.5}
.ex.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.exdate{text-align:center;line-height:1}
.exdate .dd{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.exdate .mm{font-family:var(--disp);font-size:9.5px;letter-spacing:.16em;color:var(--ink3);font-weight:700;margin-top:4px}
.exdate .ww{font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:5px}
.exbody{min-width:0;cursor:pointer}
.exmeta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.extime{font-family:var(--disp);font-size:11.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.venue{display:inline-flex;align-items:center;gap:4px;font-family:var(--disp);font-size:11.5px;font-weight:600;
  padding:3px 8px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);
  max-width:100%;transition:border-color .18s var(--ease)}
.venue:hover{border-color:var(--lineHi)}
.venue.empty{border-style:dashed;color:var(--ink3)}
.venue svg{flex-shrink:0}
.venuein{font-family:var(--disp);font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px;
  border:1px solid var(--blue);background:var(--surface);width:150px;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
.exleft{text-align:right;min-width:50px}
.exleft b{display:block;font-family:var(--disp);font-size:25px;font-weight:700;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.exleft b.word{font-size:16px;letter-spacing:0}
.exleft span{display:block;font-family:var(--disp);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;margin-top:5px}

/* ============ sheet ============ */
.scrim{position:fixed;inset:0;background:rgba(5,12,26,.5);backdrop-filter:blur(3px);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .32s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--canvas);
  border-radius:22px 22px 0 0;box-shadow:var(--shadowUp);max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .42s var(--ease);max-width:560px;margin:0 auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{padding:9px 0 3px;display:flex;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.grab i{width:38px;height:4px;border-radius:99px;background:var(--line);display:block}
.shhead{padding:20px 17px 14px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--surface);
  border-radius:22px 22px 0 0;margin-top:-16px;position:relative}
.shtop{display:flex;align-items:flex-start;gap:12px}
.shcode{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.025em;color:var(--accent);line-height:1.05}
.shname{font-size:13.5px;color:var(--ink2);margin-top:4px;font-weight:500;line-height:1.35}
.shbtn{margin-left:auto;flex-shrink:0;display:flex;gap:7px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  display:grid;place-items:center;transition:.18s var(--ease);color:var(--ink2);flex-shrink:0}
.ibtn:active{transform:scale(.93)}
.ibtn:hover{background:var(--sky);border-color:var(--skyLine);color:var(--blueDeep)}
.ibtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.shtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:3px 7px;
  border-radius:6px;background:var(--surface2);color:var(--ink3);border:1px solid var(--line);font-family:var(--disp)}
.shbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 15px calc(env(safe-area-inset-bottom) + 22px);flex:1}
.sheet.editing .shbody{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}

.warnbar{margin-top:11px;font-size:11.5px;padding:8px 11px;border-radius:9px;background:rgba(217,138,11,.1);

.comp{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px 13px;

.comprow{display:flex;flex-direction:column;gap:7px}
.cnm{font-size:14px;font-weight:600;line-height:1.25}
.cw{font-size:11px;color:var(--ink3);margin-top:3px;font-weight:500;font-variant-numeric:tabular-nums}

.erow{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;

.addbox{background:var(--surface);border:1px dashed var(--line);border-radius:var(--rs);padding:13px;margin-top:9px}

  margin-bottom:9px;font-family:var(--disp)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);transition:.18s var(--ease)}

.savebar{position:absolute;left:0;right:0;bottom:0;padding:12px 15px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;gap:9px;transform:translateY(120%);transition:transform .34s var(--ease);pointer-events:none}

.btn{flex:1;padding:13px;border-radius:11px;font-family:var(--disp);font-size:14px;font-weight:700;
  transition:.18s var(--ease);text-align:center}

/* ============ footer ============ */

  font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow);transition:.18s var(--ease);

  background:var(--blue);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;
  z-index:99;transition:transform .38s var(--ease),visibility 0s .38s;box-shadow:0 12px 30px -10px rgba(47,107,255,.6);
  white-space:nowrap;visibility:hidden}

/* ============ install pop-up (browser only) ============ */

  <aside class="side">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>

      </div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const COURSES = {
  "CS310":  {code:"CS 310",  name:"Automata Theory",                                   cr:6, slot:"2A 2B 2C",    tag:"Core Course",           prof:"Krishna Shankara Narayanan", room:"LH 101", c:"#2F6BFF"},
  "CS675":  {code:"CS 675",  name:"Computer Graphics",                                 cr:6, slot:"4A 4B",       tag:"Departmental Elective", prof:"Parag Kumar Chaudhuri",      room:"CC 103", c:"#7A5AF8"},
  "CS405":  {code:"CS 405",  name:"Game Theory and Algorithmic Mechanism Design",      cr:6, slot:"11A 11B",     tag:"Departmental Elective", prof:"Swaprava Nath",              room:"LA 001", c:"#0EA5B7"},
  "CS6008": {code:"CS 6008", name:"Network Security",                                  cr:6, slot:"10A 10B",     tag:"Departmental Elective", prof:"Devashish Gosain",           room:"CC 101", c:"#D99A00"},
  "HS459":  {code:"HS 459",  name:"Cognitive and Psychological Testing: Labs to Life", cr:6, slot:"5A 5B",       tag:"HASMED Elective",       prof:"Shweta Kiran Chawak",        room:"LT 003", c:"#E5484D"},
  "HS449":  {code:"HS 449",  name:"Capitalism: theories, histories, varieties",        cr:6, slot:"12A 12B 12C", tag:"HASMED Elective",       prof:"Anush Kapadia",              room:"LH 102", c:"#16A34A"},
  "HS676":  {code:"HS 676",  name:"The Philosophy of Shabdayoga",                      cr:6, slot:"8A 8B",       tag:"HASMED Elective",       prof:"Malhar Arvind Kulkarni",     room:"LC 001", c:"#E0569B"},
  "HS472":  {code:"HS 472",  name:"Psychology of Health",                              cr:6, slot:"7A 7B",       tag:"HASMED Elective",       prof:"Mrinmoyi Kulkarni",          room:"LT 105", c:"#EA7A12"},
};

const DAYS = ["Mon","Tue","Wed","Thu","Fri"];
const FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};

const SCHED = {
  Mon:[ {k:"CS310", s:"10:35", e:"11:30"}, {k:"HS676", s:"14:00", e:"15:25"}, {k:"HS449", s:"17:05", e:"18:00"} ],
  Tue:[ {k:"CS675", s:"08:00", e:"09:25"}, {k:"CS310", s:"10:35", e:"11:30"}, {k:"CS6008",s:"14:00", e:"15:25"}, {k:"CS405", s:"15:30", e:"16:55"}, {k:"HS449", s:"17:05", e:"18:00"} ],
  Wed:[ {k:"HS459", s:"08:00", e:"09:25"}, {k:"HS472", s:"11:05", e:"12:30"} ],
  Thu:[ {k:"CS675", s:"08:00", e:"09:25"}, {k:"CS310", s:"10:35", e:"11:30"}, {k:"HS676", s:"14:00", e:"15:25"}, {k:"HS449", s:"17:05", e:"18:00"} ],
  Fri:[ {k:"HS459", s:"08:00", e:"09:25"}, {k:"HS472", s:"11:05", e:"12:30"}, {k:"CS6008",s:"14:00", e:"15:25"}, {k:"CS405", s:"15:30", e:"16:55"} ],
};

// End-semester exams, Autumn 2026-27 (IIT Bombay Academic Office timetable, 12 Oct 2026). Times are IST.
// Venues come from the seating plan; set them in the app by tapping "Add venue".
const EXAMS = [
  {k:"HS449",  date:"2026-11-11", s:"09:00", e:"12:00"},
  {k:"CS310",  date:"2026-11-12", s:"09:00", e:"12:00"},
  {k:"CS405",  date:"2026-11-13", s:"09:00", e:"12:00"},
  {k:"CS6008", date:"2026-11-15", s:"09:00", e:"12:00"},
  {k:"CS675",  date:"2026-11-16", s:"18:00", e:"21:00"},
  {k:"HS459",  date:"2026-11-17", s:"09:00", e:"12:00"},
  {k:"HS472",  date:"2026-11-19", s:"09:00", e:"12:00"},
  {k:"HS676",  date:"2026-11-20", s:"09:00", e:"12:00"},
];

const PRESETS = ["Quiz","Midsem","Endsem","Assignment","Project","Lab","Journal","Attendance","Participation","Presentation","Viva","Term paper","Custom"];
const DEFAULT_W = {Quiz:10, Midsem:30, Endsem:40, Assignment:10, Project:20, Lab:15, Journal:10, Attendance:5, Participation:5, Presentation:10, Viva:10, "Term paper":20, Custom:10};

/* ============================================================
   STORE
   Marks use the same key and shape as the old timetable app, so
   its data (and its backup files) load here unchanged.
   ============================================================ */
const KEY = "semester.v1";
const PREFS_KEY = "semester.prefs.v1";
let store = {};
let prefs = {venues:{}};

function canStore(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; }
}
const HAS_LS = canStore();

function load(){
  if(!HAS_LS) return;
  try{ store = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ store = {}; }
  try{ Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY)) || {}); }catch(e){}
  if(!prefs.venues || typeof prefs.venues !== "object") prefs.venues = {};
}
function save(){
  if(!HAS_LS) return;
  try{
    localStorage.setItem(KEY, JSON.stringify(store));
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  }catch(e){ toast("Storage is full"); }
}
function entry(k){
  if(!store[k]) store[k] = {items:[], note:""};
  if(!store[k].items) store[k].items = [];
  if(store[k].note === undefined) store[k].note = "";
  return store[k];
}
load();

/* ============================================================
   HELPERS
   ============================================================ */
const $  = s => document.querySelector(s);
const mins = t => (+t.slice(0,2))*60 + (+t.slice(3,5));
const pad  = n => String(n).padStart(2,"0");
const uid  = () => Math.random().toString(36).slice(2,9);
const esc  = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num  = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };

const col = k => COURSES[k].c;
function tint(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function todayKey(){
  const g = new Date().getDay();
  return (g >= 1 && g <= 5) ? DAYS[g-1] : null;
}
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function fmtDur(m){ const h = Math.floor(m/60), r = m % 60; return h ? `${h}h ${pad(r)}m` : `${r}m`; }

// Exams are stored in IST so countdowns stay right even if the phone is set to another zone.
const exStart = x => new Date(`${x.date}T${x.s}:00+05:30`);
const exEnd   = x => new Date(`${x.date}T${x.e}:00+05:30`);
function exState(x){ const n = Date.now(); return n < exStart(x) ? "up" : n < exEnd(x) ? "live" : "done"; }
const nextExam = () => EXAMS.find(x => Date.now() < exEnd(x)) || null;
const dateUTC = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d); };
function daysUntil(s){ const n = new Date(); return Math.round((dateUTC(s) - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))/864e5); }
function fmtDay(s, opts){ return new Date(dateUTC(s)).toLocaleDateString("en-GB", Object.assign({timeZone:"UTC"}, opts)); }

function stats(k){
  const it = (store[k] && store[k].items) || [];
  let total = 0, graded = 0, earned = 0;
  it.forEach(c => {
    const w = num(c.w) || 0;
    total += w;
    const sc = num(c.sc), mx = num(c.mx);
    if(sc !== null && mx && mx > 0){ graded += w; earned += (sc/mx)*w; }
  });
  return {total, graded, earned, pct: graded > 0 ? (earned/graded)*100 : null, count: it.length};
}
function tone(p){
  if(p === null) return "var(--ink3)";
  if(p >= 80) return "var(--green)";
  if(p >= 60) return "var(--blue)";
  if(p >= 40) return "var(--amber)";
  return "var(--red)";
}

let toastT;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 2100);
}

function ring(pct, size, sw){
  const r = (size - sw)/2, C = 2*Math.PI*r;
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const off = C - (p/100)*C;
  return `<div class="ring" style="width:${size}px;height:${size}px;--rc:${tone(pct)}">
    <svg width="${size}" height="${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"></circle>
      <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
    </svg>
    <div class="ringtxt">
      <div class="ringnum">${pct === null ? "&ndash;" : Math.round(pct)}</div>
      <div class="ringsub">${pct === null ? "NO DATA" : "PERCENT"}</div>
    </div>
  </div>`;
}

const ICON = {
  pin:  `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>`,
};

/* ============================================================
   HEADER + STATUS
   ============================================================ */
function nextUp(){
  const tk = todayKey(), nm = nowMin();
  if(tk){
    const up = SCHED[tk].find(c => mins(c.s) > nm);
    if(up) return {c:up, day:null};
  }
  const start = tk ? DAYS.indexOf(tk) : (new Date().getDay() === 6 ? -1 : 4);
  for(let i = 1; i <= 5; i++){
    const d = DAYS[(((start + i) % 5) + 5) % 5];
    if(SCHED[d].length) return {c:SCHED[d][0], day:d};
  }
  return null;
}

function renderHead(){
  const d = new Date(), tk = todayKey();
  $("#clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  $("#todayName").textContent = tk ? FULL[tk] : ["Sunday","","","","","","Saturday"][d.getDay()];
  $("#eyebrow").textContent = d.toLocaleDateString("en-GB", {day:"numeric", month:"long"});

  const nm = nowMin();
  const live = tk ? SCHED[tk].find(c => mins(c.s) <= nm && nm < mins(c.e)) : null;
  const box = $("#status");
  let html = "";

  if(live){
    const m = COURSES[live.k];
    const s = mins(live.s), e = mins(live.e);
    const p = Math.round(((nm - s)/(e - s))*100);
    box.style.setProperty("--accent", col(live.k));
    html = `<span class="stag live"><span class="pulse"></span>In class</span>
      <div class="shead"><span class="scode">${esc(m.code)}</span><span class="sroom">${esc(m.room)}</span></div>
      <div class="sname">${esc(m.name)}</div>
      <div class="strack"><div class="sfill" style="width:${p}%"></div></div>
      <div class="smeta"><span>${live.s} to ${live.e}</span><strong>${e - nm} min left</strong></div>`;
  } else {
    const free = !tk ? "Weekend. Nothing on the board." : "No class right now.";
    box.style.setProperty("--accent", "var(--green)");
    html = `<span class="stag free">Free</span>
      <div class="shead"><span class="scode" style="font-size:20px;color:var(--ink2)">${free}</span></div>`;
  }

  const nx = nextUp();
  if(nx){
    const m = COURSES[nx.c.k];
    let when;
    if(nx.day){ when = FULL[nx.day] + " " + nx.c.s; }
    else {
      const diff = mins(nx.c.s) - nm;
      const h = Math.floor(diff/60), mn = diff % 60;
      when = "in " + (h ? h + "h " : "") + mn + "m";
    }
    html += `<div class="snext"><span class="stag soon">Next</span>
      <span class="nc" style="color:${col(nx.c.k)}">${esc(m.code)}</span>
      <span class="nr">${esc(m.room)}</span>
      <span class="nw">${when}</span></div>`;
  }

  const xe = nextExam();
  if(xe){
    const st = exState(xe), dd = daysUntil(xe.date);
    const when = st === "live" ? "on now" : dd <= 0 ? "today " + xe.s : dd === 1 ? "tomorrow" : "in " + dd + " days";
    html += `<button class="snext" data-go="exams"><span class="stag exam">Endsem</span>
      <span class="nc" style="color:${col(xe.k)}">${esc(COURSES[xe.k].code)}</span>
      <span class="nr">${fmtDay(xe.date, {day:"numeric", month:"short"})}</span>
      <span class="nw">${when}</span></button>`;
  }

  box.innerHTML = html;
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const f = box.querySelector(".sfill");
  if(f){ const w = f.style.width; f.style.width = "0"; requestAnimationFrame(() => f.style.width = w); }
}

/* ============================================================
   VIEWS
   ============================================================ */
const VIEWS = ["today","week","exams"];
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
let selDay = todayKey() || "Mon";
let editingVenue = false;

function classRow(c, state, i){
  const m = COURSES[c.k];
  return `<button class="cls ${state}" style="--accent:${col(c.k)};animation-delay:${i*36}ms" data-k="${c.k}">
    <div class="ctime"><b>${c.s}</b>${c.e}</div>
    <div style="min-width:0">
      <div class="ccode">${esc(m.code)}</div>
      <div class="cname">${esc(m.name)}</div>
      <div class="cwho">${esc(m.prof)}</div>
    </div>
    <div class="cright">
      <span class="croom">${esc(m.room)}</span>
      ${state === "live" ? '<span class="clivebadge">LIVE</span>' : ""}
    </div>
  </button>`;
}

function viewToday(){
  const tk = todayKey(), nm = nowMin(), d = selDay, isToday = d === tk;
  let out = `<div class="days" role="group" aria-label="Pick a day">`;
  DAYS.forEach(x => {
    out += `<button class="dchip ${x === tk ? "is-today" : ""}" aria-pressed="${x === d}" data-day="${x}">
      <span class="dn">${x}</span><span class="dc">${SCHED[x].length} lec</span></button>`;
  });
  out += `</div>`;

  const list = SCHED[d];
  const total = list.reduce((a, c) => a + mins(c.e) - mins(c.s), 0);
  out += `<div class="section">${FULL[d]}${isToday ? " &middot; today" : ""}
    <span class="sx">${list.length} ${list.length === 1 ? "lecture" : "lectures"} &middot; ${fmtDur(total)}</span></div>`;
  if(!list.length) return out + `<div class="blank"><div class="bt">Clear day</div><div class="bs">No lectures.</div></div>`;

  out += `<div class="rail">`;
  let placed = false;
  list.forEach((c, i) => {
    const s = mins(c.s), e = mins(c.e);
    if(isToday && !placed && nm < s){
      out += `<div class="nowline" style="animation-delay:${i*36}ms">
        <span class="lbl" id="nowLbl">NOW ${pad(Math.floor(nm/60))}:${pad(nm%60)}</span><span class="ln"></span></div>`;
      placed = true;
    }
    if(i > 0){
      const g = s - mins(list[i-1].e);
      if(g >= 15) out += `<div class="gap" style="animation-delay:${i*36}ms">${fmtDur(g)} free</div>`;
    }
    const st = isToday ? ((nm >= s && nm < e) ? "live" : (nm >= e ? "past" : "")) : "";
    out += classRow(c, st, i);
  });
  out += `</div>`;
  if(isToday && nm >= mins(list[list.length-1].e)) out += `<div class="doneline">Done for today</div>`;
  return out;
}

const WK_S = 8*60, WK_E = 18*60;
const wkPos = m => ((m - WK_S)/(WK_E - WK_S)*100).toFixed(3) + "%";

function viewWeek(){
  const tk = todayKey(), nm = nowMin();
  let out = `<div class="wk"><div class="wkhead"><span></span>`;
  DAYS.forEach(d => out += `<span class="wkday ${d === tk ? "on" : ""}">${d}</span>`);
  out += `</div><div class="wkbody"><div class="wkhours">`;
  for(let h = 8; h <= 18; h++) out += `<span style="top:${wkPos(h*60)}">${pad(h)}</span>`;
  out += `</div>`;

  DAYS.forEach((d, di) => {
    out += `<div class="wkcol ${d === tk ? "on" : ""}">`;
    SCHED[d].forEach((c, i) => {
      const m = COURSES[c.k], s = mins(c.s), e = mins(c.e), cc = col(c.k);
      const st = d === tk ? ((nm >= s && nm < e) ? "live" : (nm >= e ? "past" : "")) : "";
      out += `<button class="blk ${st}" data-goday="${d}" aria-label="${esc(m.code)}, ${FULL[d]} ${c.s} to ${c.e}, ${esc(m.room)}"
        style="top:${wkPos(s)};height:calc(${wkPos(e)} - ${wkPos(s)} - 3px);--accent:${cc};--tint:${tint(cc, .1)};animation-delay:${(di*3 + i)*22}ms">
        <b>${esc(innerWidth < 920 ? m.code.replace(" ", "") : m.code)}</b><i>${esc(m.room)}</i>${e - s >= 80 ? `<i>${c.s}</i>` : ""}</button>`;
    });
    if(d === tk && nm >= WK_S && nm <= WK_E) out += `<div class="wknow" id="wkNow" style="top:${wkPos(nm)}"></div>`;
    out += `</div>`;
  });
  out += `</div></div>`;

  const all = DAYS.flatMap(d => SCHED[d]);
  const total = all.reduce((a, c) => a + mins(c.e) - mins(c.s), 0);
  const busiest = DAYS.reduce((b, d) => SCHED[d].length > SCHED[b].length ? d : b, DAYS[0]);
  out += `<div class="wksum">
    <div class="stat"><div class="statnum">${all.length}</div><div class="statlbl">Lectures</div></div>
    <div class="stat" style="animation-delay:50ms"><div class="statnum">${Math.floor(total/60)}h ${pad(total%60)}</div><div class="statlbl">Per week</div></div>
    <div class="stat" style="animation-delay:100ms"><div class="statnum">${busiest}</div><div class="statlbl">Busiest</div></div>
  </div>`;
  return out;
}

function countdownParts(){
  const x = nextExam();
  if(!x) return null;
  const live = exState(x) === "live";
  let t = Math.max(0, Math.floor(((live ? exEnd(x) : exStart(x)) - Date.now())/1000));
  const d = Math.floor(t/86400); t %= 86400;
  const h = Math.floor(t/3600); t %= 3600;
  return [d, h, Math.floor(t/60), t % 60];
}

function hero(){
  const x = nextExam();
  if(!x){
    return `<div class="hero"><div class="htag">Endsem</div>
      <div class="hdone">All exams done.</div><div class="hname">Enjoy the break.</div></div>`;
  }
  const m = COURSES[x.k], live = exState(x) === "live";
  const p = countdownParts();
  const venue = prefs.venues[x.k];
  let out = `<div class="hero">
    <div class="htag">${live ? "In the hall now &middot; ends in" : "Next exam &middot; " + fmtDay(x.date, {weekday:"long", day:"numeric", month:"short"})}</div>
    <div class="hcode">${esc(m.code)}</div>
    <div class="hname">${esc(m.name)}</div>
    <div class="cd" id="cd">${["days","hrs","min","sec"].map((u, i) => `<div><b>${pad(p[i])}</b><span>${u}</span></div>`).join("")}</div>
    <div class="hchips">
      <span class="hchip">${x.s} &ndash; ${x.e}</span>
      <span class="hchip">${venue ? esc(venue) : "Venue not set"}</span>
    </div>`;

  // One cell per day of the exam fortnight, coloured where an exam falls.
  const first = dateUTC(EXAMS[0].date), last = dateUTC(EXAMS[EXAMS.length-1].date);
  const n = Math.round((last - first)/864e5) + 1;
  const today = daysUntil(EXAMS[0].date) * -1;
  out += `<div class="track" style="grid-template-columns:repeat(${n},minmax(0,1fr))">`;
  for(let i = 0; i < n; i++){
    const iso = new Date(first + i*864e5).toISOString().slice(0,10);
    const ex = EXAMS.find(e => e.date === iso);
    const cls = [ex ? "hit" : "", i < today || (ex && exState(ex) === "done") ? "past" : "", i === today ? "now" : ""].join(" ");
    out += `<div class="tc ${cls}" ${ex ? `style="--tc:${col(ex.k)}" title="${esc(COURSES[ex.k].code)}"` : ""}>${+iso.slice(8)}</div>`;
  }
  out += `</div><div class="tlbl"><span>${fmtDay(EXAMS[0].date, {day:"numeric", month:"short"})}</span>
    <span>${EXAMS.filter(e => exState(e) !== "done").length} to go</span>
    <span>${fmtDay(EXAMS[EXAMS.length-1].date, {day:"numeric", month:"short"})}</span></div></div>`;
  return out;
}

function viewExams(){
  let out = hero();
  out += `<div class="section">All exams<span class="sx">tap a venue to set it</span></div><div class="rail">`;
  EXAMS.forEach((x, i) => {
    const m = COURSES[x.k], st = exState(x), dd = daysUntil(x.date), venue = prefs.venues[x.k];
    if(i > 0){
      const prev = EXAMS[i-1];
      const hrs = (exStart(x) - exEnd(prev))/36e5;
      const free = Math.round((dateUTC(x.date) - dateUTC(prev.date))/864e5) - 1;
      const warn = hrs < 18;
      const txt = warn ? `only ${Math.round(hrs)}h after ${esc(COURSES[prev.k].code)}`
        : free === 0 ? "next day" : `${free} free day${free > 1 ? "s" : ""}`;
      out += `<div class="gap ${warn ? "warn" : ""}" style="animation-delay:${i*36}ms">${txt}</div>`;
    }
    const left = st === "done" ? `<b class="word">Done</b><span>&#10003;</span>`
      : st === "live" ? `<b class="word">Now</b><span>till ${x.e}</span>`
      : dd <= 0 ? `<b class="word">Today</b><span>${x.s}</span>`
      : `<b>${dd}</b><span>${dd === 1 ? "day left" : "days left"}</span>`;
    out += `<div class="ex ${st === "up" ? "" : st}" style="--accent:${col(x.k)};animation-delay:${i*36}ms">
      <div class="exdate">
        <div class="dd">${+x.date.slice(8)}</div>
        <div class="mm">${fmtDay(x.date, {month:"short"}).toUpperCase()}</div>
        <div class="ww">${fmtDay(x.date, {weekday:"short"})}</div>
      </div>
      <div class="exbody" data-k="${x.k}">
        <div class="ccode">${esc(m.code)}</div>
        <div class="cname">${esc(m.name)}</div>
        <div class="exmeta">
          <span class="extime">${x.s}&ndash;${x.e}</span>
          <button class="venue ${venue ? "" : "empty"}" data-venue="${x.k}">${ICON.pin}${venue ? esc(venue) : "Add venue"}</button>
        </div>
      </div>
      <div class="exleft">${left}</div>
    </div>`;
  });
  out += `</div>`;
  return out;
}

function render(){
  const v = $("#view");
  v.innerHTML = view === "today" ? viewToday() : view === "week" ? viewWeek() : viewExams();
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
  v.querySelectorAll("[data-k]").forEach(el => el.onclick = e => {
    if(e.target.closest("[data-venue]")) return;
    openSheet(el.dataset.k);
  });
  v.querySelectorAll("[data-day]").forEach(el => el.onclick = () => { selDay = el.dataset.day; render(); });
  v.querySelectorAll("[data-goday]").forEach(el => el.onclick = () => { selDay = el.dataset.goday; go("today"); });
  v.querySelectorAll("[data-venue]").forEach(el => el.onclick = () => editVenue(el));
  $("#foot").textContent = view === "week" ? "Tap a block to open that day"
    : view === "exams" ? "Tap a course for its marks" : "Tap a lecture to open its marks";
}

function editVenue(btn){
  const k = btn.dataset.venue;
  const inp = document.createElement("input");
  inp.className = "venuein";
  inp.value = prefs.venues[k] || "";
  inp.placeholder = "e.g. LH 101, seat 42";
  inp.setAttribute("aria-label", "Venue for " + COURSES[k].code);
  btn.replaceWith(inp);
  editingVenue = true;
  inp.focus();
  let done = false;
  const finish = keep => {
    if(done) return; done = true;
    editingVenue = false;
    if(keep){
      const v = inp.value.trim();
      if(v) prefs.venues[k] = v; else delete prefs.venues[k];
      save(); toast(v ? "Venue saved" : "Venue cleared");
    }
    render();
  };
  inp.onkeydown = e => { if(e.key === "Enter") finish(true); if(e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
}

function moveGlide(){
  const t = $("#tabs").querySelector('[aria-selected="true"]');
  const g = $("#glide");
  g.style.width = t.offsetWidth + "px";
  g.style.transform = `translateX(${t.offsetLeft}px)`;
}
function go(v){
  view = v;
  history.replaceState(null, "", "#" + v);
  $("#tabs").querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.v === v));
  moveGlide(); render();
  if(innerWidth < 920) $("#tabs").scrollIntoView({behavior:"smooth", block:"nearest"});
}
$("#tabs").querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.v));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(VIEWS.includes(h) && h !== view) go(h); });

/* ============================================================
   SHEET  (marks and notes for one course)
   ============================================================ */
let active = null, editing = false, snapshot = null;

function openSheet(k){
  active = k; editing = false;
  drawSheet();
  $("#scrim").classList.add("open");
  $("#sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  if(editing){ commit(true); return; }
  $("#scrim").classList.remove("open");
  $("#sheet").classList.remove("open");
  document.body.style.overflow = "";
  active = null;
  render();
}
$("#scrim").onclick = closeSheet;
$("#grab").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key === "Escape" && active) closeSheet(); });

function drawSheet(){
  const m = COURSES[active], d = entry(active), s = stats(active);
  const sheet = $("#sheet");
  sheet.style.setProperty("--accent", col(active));
  sheet.classList.toggle("editing", editing);
  const ex = EXAMS.find(x => x.k === active);

  $("#shhead").innerHTML = `
    <div class="shtop">
      <div style="min-width:0">
        <div class="shcode">${esc(m.code)}</div>
        <div class="shname">${esc(m.name)}</div>
      </div>
      <div class="shbtn">
        <button class="ibtn ${editing ? "on" : ""}" id="editBtn" aria-label="Edit components">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="ibtn" id="closeBtn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="shtags">
      <span class="chip">${esc(m.tag)}</span>
      <span class="chip">${m.cr} credits</span>
      <span class="chip">Slot ${esc(m.slot)}</span>
      <span class="chip">${esc(m.room)}</span>
      ${ex ? `<span class="chip">Endsem ${fmtDay(ex.date, {day:"numeric", month:"short"})}</span>` : ""}
    </div>`;

  $("#editBtn").onclick = () => { if(editing){ commit(false); } else { editing = true; snapshot = JSON.parse(JSON.stringify(d)); drawSheet(); } };
  $("#closeBtn").onclick = closeSheet;

  $("#shbody").innerHTML = editing ? bodyEdit(d) : bodyView(d, s);
  editing ? wireEdit() : wireView();
  const fg = $("#shbody").querySelector(".fg");
  if(fg){ const o = fg.getAttribute("stroke-dashoffset"); const c = fg.getAttribute("stroke-dasharray");
    fg.setAttribute("stroke-dashoffset", c); requestAnimationFrame(() => setTimeout(() => fg.setAttribute("stroke-dashoffset", o), 40)); }
}

function bodyView(d, s){
  let out = `<div class="score">
    ${ring(s.pct, 76, 6)}
    <div class="sgrid">
      <div class="sitem"><div class="k">Secured</div><div class="v">${s.earned.toFixed(1)}<span class="vsub">/${s.graded}</span></div></div>
      <div class="sitem"><div class="k">Graded</div><div class="v">${s.graded}%</div></div>
      <div class="sitem"><div class="k">Mapped</div><div class="v">${s.total}%</div></div>
      <div class="sitem"><div class="k">Pending</div><div class="v">${Math.max(0, s.total - s.graded)}%</div></div>
    </div>
  </div>`;

  if(s.graded > 0){
    out += `<div class="hintbar">${s.earned.toFixed(1)} of 100 locked in so far &middot; the ring is your score across the ${s.graded}% already graded.</div>`;
  }
  if(s.count && s.total !== 100){
    out += `<div class="warnbar">Weights add up to ${s.total}%. Adjust them when the professor confirms the split.</div>`;
  }

  out += `<div class="section">Components</div>`;
  if(!d.items.length){
    out += `<div class="blank"><div class="bt">Nothing here yet</div>
      <div class="bs">Tap the pencil above to add quizzes, exams, projects and anything else this course is graded on.</div></div>`;
  } else {
    out += `<div class="marklbl"><span>Got</span><span>Out of</span></div><div class="comprow">`;
    d.items.forEach((c, i) => {
      const sc = num(c.sc), mx = num(c.mx), w = num(c.w) || 0;
      const has = sc !== null && mx && mx > 0;
      const p = has ? (sc/mx)*100 : null;
      const scaled = has ? (sc/mx)*w : null;
      out += `<div class="comp" style="animation-delay:${i*30}ms">
        <div style="min-width:0">
          <div class="cnm">${esc(c.n)}</div>
          <div class="cw">Weight ${esc(c.w)}% of grade</div>
        </div>
        <div>
          <div class="mark">
            <input type="number" inputmode="decimal" step="any" min="0" placeholder="&ndash;"
              value="${sc === null ? "" : sc}" data-id="${esc(c.id)}" data-f="sc" aria-label="Marks obtained in ${esc(c.n)}">
            <span class="of">/</span>
            <input class="mxin" type="number" inputmode="decimal" step="any" min="0" placeholder="max"
              value="${mx === null ? "" : mx}" data-id="${esc(c.id)}" data-f="mx" aria-label="Maximum marks for ${esc(c.n)}">
          </div>
          <div class="pct" style="color:${tone(p)}">${
            has ? `${scaled.toFixed(1)} / ${w} <span class="sub">&middot; ${Math.round(p)}%</span>`
                : (sc !== null && !mx ? "set max marks" : "not graded")
          }</div>
        </div>
      </div>`;
    });
    out += `</div>`;
  }

  out += `<div class="section">Notes</div>`;
  out += d.note
    ? `<div class="notes"><div class="notetext">${esc(d.note)}</div></div>`
    : `<div class="notes"><div class="notetext empty">Nothing noted. Add reminders in edit mode.</div></div>`;
  return out;
}

function wireView(){
  $("#shbody").querySelectorAll(".mark input").forEach(inp => {
    inp.onchange = () => {
      const d = entry(active), it = d.items.find(x => x.id === inp.dataset.id);
      if(!it) return;
      const v = inp.value.trim();
      const val = v === "" ? null : Math.max(0, parseFloat(v) || 0);
      if(inp.dataset.f === "mx") it.mx = val; else it.sc = val;
      save(); drawSheet(); toast("Marks saved");
    };
  });
}

function bodyEdit(d){
  let out = `<div class="section">Edit components</div>`;
  if(!d.items.length){
    out += `<div class="blank"><div class="bs">Pick a component below to start.</div></div>`;
  }
  out += `<div class="comprow" id="erows">`;
  d.items.forEach((c, i) => {
    out += `<div class="erow" style="animation-delay:${i*26}ms" data-id="${esc(c.id)}">
      <div class="etop">
        <div class="efield ename"><input type="text" value="${esc(c.n)}" data-f="n" placeholder="Component name" aria-label="Name"></div>
        <button class="del" data-del="${esc(c.id)}" aria-label="Remove ${esc(c.n)}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
      <div class="ebot">
        <div><span class="elbl">Weight</span>
          <div class="efield"><input type="number" inputmode="decimal" step="any" min="0" value="${esc(c.w)}" data-f="w" aria-label="Weight"><span class="u">%</span></div></div>
        <div><span class="elbl">Out of</span>
          <div class="efield"><input type="number" inputmode="decimal" step="any" min="0" value="${c.mx === null ? "" : esc(c.mx)}" data-f="mx" placeholder="100" aria-label="Maximum marks"><span class="u">max</span></div></div>
      </div>
    </div>`;
  });
  out += `</div>`;

  out += `<div class="addbox"><div class="addlbl">Add a component</div><div class="presets">`;
  PRESETS.forEach(p => out += `<button class="pchip" data-p="${esc(p)}">${esc(p)}</button>`);
  out += `</div></div>`;

  out += `<div class="section">Notes</div>
    <div class="notes"><textarea id="noteBox" placeholder="Quiz dates, syllabus cutoffs, anything the professor mentioned">${esc(d.note)}</textarea></div>`;
  return out;
}

function wireEdit(){
  const d = entry(active);
  $("#shbody").querySelectorAll(".erow").forEach(row => {
    row.querySelectorAll("input").forEach(inp => {
      inp.oninput = () => {
        const it = d.items.find(x => x.id === row.dataset.id);
        if(!it) return;
        const f = inp.dataset.f;
        if(f === "n") it.n = inp.value;
        else if(f === "w") it.w = inp.value === "" ? 0 : Math.max(0, parseFloat(inp.value) || 0);
        else it.mx = inp.value === "" ? null : Math.max(0, parseFloat(inp.value) || 0);
      };
    });
  });
  $("#shbody").querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => { d.items = d.items.filter(x => x.id !== b.dataset.del); drawSheet(); };
  });
  $("#shbody").querySelectorAll("[data-p]").forEach(b => {
    b.onclick = () => {
      const p = b.dataset.p;
      const base = p === "Custom" ? "New component" : p;
      const numbered = ["Quiz","Assignment","Lab","Presentation","Project"].includes(p);
      let n = numbered ? 1 : 0;
      let name = numbered ? base + " 1" : base;
      while(d.items.some(x => x.n === name)){ n++; name = base + " " + n; }
      d.items.push({id:uid(), n:name, w:DEFAULT_W[p] || 10, mx:100, sc:null});
      drawSheet();
      const rows = $("#shbody").querySelectorAll(".erow");
      const last = rows[rows.length - 1];
      if(last) last.scrollIntoView({behavior:"smooth", block:"center"});
    };
  });
  const nb = $("#noteBox");
  if(nb) nb.oninput = () => { d.note = nb.value; };
}

function commit(alsoClose){
  const d = entry(active);
  d.items.forEach(c => { if(!String(c.n).trim()) c.n = "Untitled"; });
  save();
  editing = false; snapshot = null;
  if(alsoClose){
    $("#scrim").classList.remove("open");
    $("#sheet").classList.remove("open");
    $("#sheet").classList.remove("editing");
    document.body.style.overflow = "";
    active = null; render(); toast("Saved");
    return;
  }
  drawSheet(); toast("Saved");
}

$("#saveBtn").onclick = () => commit(false);
$("#cancelBtn").onclick = () => {
  if(snapshot) store[active] = JSON.parse(JSON.stringify(snapshot));
  editing = false; snapshot = null;
  drawSheet(); toast("Changes discarded");
};

/* ============================================================
   BACKUP
   The file keeps the old app's shape (one key per course) so it
   still opens there; exam venues ride along under "_venues".
   ============================================================ */
function exportData(){
  const out = Object.assign({}, store, {_venues: prefs.venues});
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "semester_backup_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup downloaded");
}
function importData(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const parsed = JSON.parse(r.result);
      if(typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) throw 0;
      const venues = parsed._venues;
      delete parsed._venues;
      const known = Object.keys(parsed).filter(k => COURSES[k]).length;
      if(!known && !venues) throw 0;
      store = parsed;
      if(venues && typeof venues === "object") prefs.venues = venues;
      save(); render(); if(active) drawSheet();
      toast(`Restored ${known} course${known === 1 ? "" : "s"}`);
    }catch(err){ toast("That file did not load"); }
  };
  r.readAsText(f);
  e.target.value = "";
}
$("#expBtn").onclick = exportData;
$("#impBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = importData;

/* ============================================================
   INSTALL POP-UP
   Chrome fires beforeinstallprompt only in the browser, never inside
   the installed app, so the pop-up shows on the website alone.
   "Not now" keeps it away for the rest of that browser session.
   ============================================================ */
const ASKED_KEY = "semester.installAsked";
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let installEvt = null;

function showInstall(){
  const p = $("#ipop");
  p.hidden = false;
  setTimeout(() => p.classList.add("open"), 30);
}
function hideInstall(){
  const p = $("#ipop");
  p.classList.remove("open");
  setTimeout(() => p.hidden = true, 320);
  try{ sessionStorage.setItem(ASKED_KEY, "1"); }catch(e){}
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installEvt = e;
  let asked = false;
  try{ asked = sessionStorage.getItem(ASKED_KEY) === "1"; }catch(err){}
  if(!standalone && !asked) setTimeout(showInstall, 700);
});
$("#ipYes").onclick = async () => {
  hideInstall();
  if(!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null;
};
$("#ipNo").onclick = hideInstall;
$("#ipop").onclick = e => { if(e.target.id === "ipop") hideInstall(); };
window.addEventListener("appinstalled", () => { hideInstall(); toast("Installed"); });

/* ============================================================
   BOOT
   ============================================================ */
function stateSig(){
  const tk = todayKey(), nm = nowMin();
  const cls = tk ? SCHED[tk].map(c => nm >= mins(c.e) ? 2 : nm >= mins(c.s) ? 1 : 0).join("") : "off";
  return [new Date().toDateString(), cls, EXAMS.map(exState).join("")].join("|");
}

let sig = stateSig(), lastMin = -1;
function tick(){
  const d = new Date();
  if(d.getMinutes() !== lastMin){
    lastMin = d.getMinutes();
    renderHead();
    const s = stateSig();
    if(s !== sig){
      if(s.split("|")[0] !== sig.split("|")[0]) selDay = todayKey() || selDay;
      sig = s;
      if(!active && !editingVenue) render();
    } else {
      const nm = nowMin();
      const lbl = $("#nowLbl"); if(lbl) lbl.textContent = `NOW ${pad(Math.floor(nm/60))}:${pad(nm%60)}`;
      const wn = $("#wkNow"); if(wn) wn.style.top = wkPos(nm);
    }
  }
  const cd = $("#cd");
  if(cd){
    const p = countdownParts();
    if(p) cd.querySelectorAll("b").forEach((b, i) => { const t = pad(p[i]); if(b.textContent !== t) b.textContent = t; });
  }
}


$("#tabs").querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.v === view));
renderHead(); render();
document.fonts && document.fonts.ready.then(moveGlide);
moveGlide();
requestAnimationFrame(() => { moveGlide(); $("#glide").classList.add("ready"); });
window.addEventListener("resize", moveGlide);
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ lastMin = -1; tick(); } });

if(!HAS_LS) setTimeout(() => toast("Open the hosted page to save data"), 900);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
